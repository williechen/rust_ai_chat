name: Test All

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-workspace:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rust_ai_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rust_ai_chat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ANALYTICS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rust_ai_chat_test
      ANALYTICS_CHAT_TOKEN: local-ci-chat-token
      ANALYTICS_PET_TOKEN: local-ci-pet-token
      CHAT_DATABASE_URL: "sqlite::memory:"
      PET_DATABASE_URL: "sqlite::memory:"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Test workspace
        run: cargo test --locked -p workspace-tests

