<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Rust AI Desktop Pet</title>

  <style>
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  body {
    display: grid;
    place-items: center;
    font-family: system-ui, sans-serif;
  }

  .pet-shell {
    width: 220px;
    padding: 20px;
    border-radius: 28px;
    background: rgba(30, 30, 36, 0.82);
    color: white;
    text-align: center;
  }
</style>

</head>

<body>
  <main class="pet-shell">
    <h1>🐾 Rust AI Desktop Pet</h1>

    <p>
      state:
      <strong id="state">loading</strong>
    </p>

    <p>
      revision:
      <strong id="revision">-</strong>
    </p>

    <button data-command="interact">
      互動
    </button>

    <button data-command="finish_interaction">
      結束互動
    </button>

    <button data-command="sleep">
      睡覺
    </button>

    <button data-command="wake">
      醒來
    </button>

    <pre id="error"></pre>
  </main>

  <script src="./pet.js"></script>
</body>
</html>
