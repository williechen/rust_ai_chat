[workspace]
resolver = "3"
members = [
    "apps/desktop_pet",
    "apps/desktop_pet/frontend",
    "apps/server",
    "crates/ai_core",
    "crates/chat_domain",
    "crates/shared",
    "crates/persistence",
    "crates/pet_domain",
    "crates/telemetry",
    "crates/ui",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }

leptos = "0.8"

opentelemetry = "0.33"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"

uuid = { version = "1.26", features = ["serde", "v4"] }
