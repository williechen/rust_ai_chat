name: Rust Analytics

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: analytics-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: analytics_apps

jobs:
  check-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config

      - name: Check stats server
        run: cargo check --locked -p stats-server
        
  build-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config

      - name: Build stats server
        run: cargo build --locked -p stats-server --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analytics-linux
          if-no-files-found: error
          path: |
            analytics_apps/target/release/server
            analytics_apps/target/release/bootstrap_admin