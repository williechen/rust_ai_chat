<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Rust AI Desktop Pet</title>

  <link data-trunk rel="css" href="style.css" />
</head>

<body>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    window.getPetState = () => {
      return invoke("get_pet_state");
    };

    window.sendPetCommand = (command) => {
      return invoke("send_pet_command", { command });
    };

    window.listenPetState = (callback) => {
      return listen(
        "pet://state-changed",
        (event) => callback(event.payload),
      );
    };

    window.chatWithPet = (message) => {
      return invoke("chat_with_pet", { message });
    };

    let petContextMenu = null;

    async function getPetContextMenu() {
      if (petContextMenu) {
        return petContextMenu;
      }

      const { Menu } = window.__TAURI__.menu;

      petContextMenu = await Menu.new({
        items: [
          {
            id: "interact",
            text: "互動",
          },
          {
            id: "sleep",
            text: "睡覺",
          },
          {
            id: "wake",
            text: "醒來",
          },
        ],
      });

      return petContextMenu;
    }

    window.showPetContextMenu = async (x, y) => {
      const menu = await getPetContextMenu();

      const {
        getCurrentWindow,
      } = window.__TAURI__.window;

      const {
        LogicalPosition,
      } = window.__TAURI__.dpi;

      const appWindow = getCurrentWindow();

      await menu.popup(
        new LogicalPosition(x, y),
        appWindow,
      );
    };

    window.scanFilePreview = async () => {
      return invoke("scan_file_preview");
    };

  </script>

  <link data-trunk rel="rust" />
</body>
</html>
