name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-chat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y dist-upgrade
          sudo apt-get install -y \
            build-essential \
            pkg-config
            
      - name: Install cargo-leptos
        run: cargo install cargo-leptos --locked

      - name: Check server ssr
        run: cargo check -p server --features ssr

      - name: Check ui ssr
        run: cargo check -p ui --features ssr

      - name: Check ui
        run: cargo check -p ui --features hydrate --target wasm32-unknown-unknown


  check-pet:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y dist-upgrade
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Check native dependencies
        run: |
          echo "GLib:"
          pkg-config --modversion glib-2.0

          echo "GTK:"
          pkg-config --modversion gtk+-3.0

          echo "libsoup:"
          pkg-config --modversion libsoup-3.0

          echo "JavaScriptCore:"
          pkg-config --modversion javascriptcoregtk-4.1

          echo "WebKitGTK:"
          pkg-config --modversion webkit2gtk-4.1

      - name: Install trunk
        run: cargo install trunk --locked

      - name: Check native workspace
        run: cargo check --workspace --exclude desktop-pet-frontend

      - name: Check desktop frontend
        run: cargo check -p desktop-pet-frontend --target wasm32-unknown-unknown

  check-dashboard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y dist-upgrade
          sudo apt-get install -y \
            build-essential \
            pkg-config

      - name: Check stats server
        run: cargo check -p stats-server
        
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y dist-upgrade
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Test desktop-pet
        run: cargo test -p desktop-pet

      - name: Test server
        run: cargo test -p server
      
      - name: Test stats server
        run: cargo test -p stats-server

      - name: Test ai core
        run: cargo test -p ai-core

      - name: Test chat application
        run: cargo test -p chat-application

      - name: Test chat domain
        run: cargo test -p chat-domain

      - name: Test pet domain
        run: cargo test -p pet-domain

      - name: Test shared
        run: cargo test -p shared

      - name: Test ui
        run: cargo test -p ui

  node-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node.js dependencies
        run: npm install

      - name: Run Node.js tests
        run: npm test

  unit-of-work-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rust_ai_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rust_ai_chat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rust_ai_chat_test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version "^0.9" --no-default-features --features postgres --locked

      - name: Run database migrations
        run: sqlx migrate run

      - name: Test persistence
        run: cargo test -p persistence

  build-chat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y dist-upgrade
          sudo apt-get install -y \
            build-essential \
            pkg-config

      - name: Install cargo-leptos
        run: cargo install cargo-leptos --locked

      - name: Build server
        run: cargo leptos build --release

  build-pet:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y dist-upgrade
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Check native dependencies
        run: cargo build --workspace --exclude desktop-pet-frontend --verbose

      - name: Install trunk
        run: cargo install trunk --locked

      - name: Build desktop
        working-directory: apps/desktop_pet/frontend
        run: trunk build --release