name: Rust AI Chat

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ai_chat-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: chat_apps

jobs:
  check-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config
            
      - name: Install cargo-leptos
        run: cargo install cargo-leptos --version 0.3.11 --locked

      - name: Check server ssr
        run: cargo check --locked -p chat-server --features ssr

      - name: Check ui ssr
        run: cargo check --locked -p chat-ui --features ssr

      - name: Check ui
        run: cargo check --locked -p chat-ui --features hydrate --target wasm32-unknown-unknown

  build-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config

      - name: Install cargo-leptos
        run: cargo install cargo-leptos --version 0.3.11 --locked

      - name: Build server
        run: cargo leptos build --cargo-locked --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chat-linux
          if-no-files-found: error
          path: |
            chat_apps/target/release/chat-server
            chat_apps/target/site
